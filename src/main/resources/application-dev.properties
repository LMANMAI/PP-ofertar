# Perfil de desarrollo local: SPRING_PROFILES_ACTIVE=dev
# Sin perfil activo la app corre con la configuración segura de application.properties.

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Ver el código de recuperación de contraseña en el log (sin SMTP local).
password-reset.dev-log-code=${PASSWORD_RESET_DEV_LOG_CODE:true}
