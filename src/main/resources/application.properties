# ── App ──
spring.application.name=PP-ofertar

# ── MySQL ──
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ofertar_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires&rewriteBatchedStatements=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# ── JPA / Hibernate ──
# El esquema lo gestiona Flyway (src/main/resources/db/migration); Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Bases creadas antes de Flyway: se toman como V1 (esquema inicial) y se aplica desde V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ──
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ── Recuperación de contraseña (código por correo) ──
# El envío usa SMTP y solo se activa si se define SPRING_MAIL_HOST (más
# SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD). Sin host, el
# código no se envía: en local se puede ver en el log con
# PASSWORD_RESET_DEV_LOG_CODE=true (nunca activarlo en producción).
password-reset.mail-from=${MAIL_FROM:no-reply@ofertar.app}
password-reset.dev-log-code=${PASSWORD_RESET_DEV_LOG_CODE:false}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Swagger / OpenAPI ──
# Apagado por defecto; el perfil dev lo enciende (application-dev.properties).
springdoc.api-docs.enabled=false
# 3.0 expresa la nulabilidad con "nullable: true"; el frontend genera sus tipos de este contrato.
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.url=/api-docs

# ── Scheduling ──
# >1 para que el sync SEPA (minutos) no bloquee el goteo de imagenes
spring.task.scheduling.pool-size=3

# ── SEPA (datos.produccion.gob.ar) ──
sepa.ckan-package-url=${SEPA_CKAN_PACKAGE_URL:https://datos.produccion.gob.ar/api/3/action/package_show?id=sepa-precios}
sepa.cache-dir=${SEPA_CACHE_DIR:${java.io.tmpdir}/sepa-cache}
# Override para esquivar bloqueos del sitio oficial (403 por IP de datacenter):
# SEPA_RESOURCE_URL apunta a un zip espejo http/https; SEPA_RESOURCE_FILE a una
# ruta local dentro del contenedor (p.ej. un volumen montado). Si ninguno está
# seteado, se sigue usando CKAN en vivo. SEPA_RESOURCE_FECHA es la fecha del
# dataset (YYYY-MM-DD) cuando no puede extraerse del nombre del archivo.
sepa.resource-url=${SEPA_RESOURCE_URL:}
sepa.resource-file=${SEPA_RESOURCE_FILE:}
sepa.resource-fecha=${SEPA_RESOURCE_FECHA:}
# cron del snapshot semanal (lunes 3 AM, hora Argentina)
sepa.sync-cron=0 0 3 * * MON
# carga del snapshot: lotes chicos con commit propio + pausa entre lotes
# (subir la pausa si el sync compite con trafico de usuarios, 0 en local)
sepa.batch-size=${SEPA_BATCH_SIZE:1000}
sepa.batch-pausa-ms=${SEPA_BATCH_PAUSA_MS:50}

# ── Imagenes de producto ──
imagenes.enabled=${IMAGENES_ENABLED:true}
# goteo: 100 EANs cada 5 minutos ~= 28k/dia, sin picos
imagenes.lote=${IMAGENES_LOTE:100}
imagenes.intervalo-ms=${IMAGENES_INTERVALO_MS:300000}
imagenes.delay-inicial-ms=60000
imagenes.reintentar-despues-de-dias=30
imagenes.max-intentos=3
imagenes.cola-maxima=5000
# orden de consulta: VTEX primero por calidad de foto (packshot profesional),
# Open Food Facts de respaldo por cobertura. Invertir si preferis priorizar
# la licencia abierta sobre la calidad de imagen.
imagenes.orden=${IMAGENES_ORDEN:vtex,openfoodfacts}
# proveedor primario: Open Food Facts (abierto, sin API key)
imagenes.openfoodfacts.url=https://world.openfoodfacts.org/api/v2/product/%s.json
imagenes.openfoodfacts.user-agent=OfertAR/1.0 (https://github.com/LMANMAI/PP-ofertar)
imagenes.openfoodfacts.requests-por-segundo=4
# fallback: catalogos VTEX de supermercados (API no documentada, ver Javadoc)
imagenes.vtex.enabled=${IMAGENES_VTEX_ENABLED:true}
imagenes.vtex.hosts=www.cotodigital3.com.ar,www.carrefour.com.ar,www.jumbo.com.ar,www.disco.com.ar
imagenes.vtex.requests-por-segundo=2

# ── Multipart (tickets) ──
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
# A long receipt is photographed in several parts, so the request total has to
# allow for all of them at once — 10MB was the per-file limit doubling as the
# whole-request limit, which 5 photos can exceed.
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:60MB}

# ── OCR Service ──
ocr.service-url=${OCR_SERVICE_URL:https://ocr-api-ofertar-ocr-ofertar.qr2vg3.easypanel.host}
ocr.username=${OCR_USERNAME:admin}
ocr.password=${OCR_PASSWORD}
ocr.timeout=${OCR_TIMEOUT:120}
# Pages of one ticket OCR'd at the same time. Raising it speeds up long
# tickets but puts proportionally more load on the OCR service.
ocr.max-concurrent-pages=${OCR_MAX_CONCURRENT_PAGES:5}

# ── Offer Scraper Service ──
offer.service-url=${OFFER_SERVICE_URL:http://localhost:3000}

# ── Tickets ──
ticket.max-per-user=${TICKET_MAX_PER_USER:50}

# ── CORS ──
# Orígenes permitidos (coma-separados). Vacío = ninguno: la app móvil no necesita CORS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ── Servidor ──
# Detrás del proxy de EasyPanel: Tomcat toma la IP real del cliente de X-Forwarded-For
# (solo si el proxy es una IP interna de confianza). La usan el rate limiting y los logs.
server.forward-headers-strategy=native
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/plain

# ── Observabilidad ──
# Solo /actuator/health (sin detalles). Sirve de healthcheck para el orquestador.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ── Logs ──
# requestId y userId (MDC) en cada línea. La salida es stdout; si se define
# logging.file.name (LOGGING_FILE_NAME), se rota por tamaño y se retienen 30 días.
logging.pattern.level=%5p [%X{requestId:-},%X{userId:-}]
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.max-file-size=50MB
logging.file.name=${LOGGING_FILE_NAME:}

# ── Rate limiting (por IP; en memoria) ──
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.auth-por-minuto=${RATE_LIMIT_AUTH_POR_MINUTO:30}
rate-limit.sepa-por-minuto=${RATE_LIMIT_SEPA_POR_MINUTO:120}
login.max-fallos-por-ip=20
login.max-fallos-por-email=10
login.ventana-minutos=15
