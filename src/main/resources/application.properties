# A long receipt is photographed in several parts, so the request total has to
# allow for all of them at once — 10MB was the per-file limit doubling as the
# whole-request limit, which 5 photos can exceed.
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:60MB}

# ── OCR Service ──
ocr.service-url=${OCR_SERVICE_URL:https://ocr-api-ofertar-ocr-ofertar.qr2vg3.easypanel.host}
ocr.username=${OCR_USERNAME:admin}
ocr.password=${OCR_PASSWORD}
ocr.timeout=${OCR_TIMEOUT:120}
# Pages of one ticket OCR'd at the same time. Raising it speeds up long
# tickets but puts proportionally more load on the OCR service.
ocr.max-concurrent-pages=${OCR_MAX_CONCURRENT_PAGES:5}

# ── Offer Scraper Service ──
offer.service-url=${OFFER_SERVICE_URL:http://localhost:3000}

# ── Tickets ──
ticket.max-per-user=${TICKET_MAX_PER_USER:50}

# ── Link de referido ──
# Dónde bajar la app. Vacío: la página sólo muestra el código.
referral.app-download-url=${REFERRAL_APP_DOWNLOAD_URL:}

# ── Consumo Inteligente ──
# Recurrente: aparece en al menos min-tickets tickets de los últimos window-days días.
recurring.window-days=${RECURRING_WINDOW_DAYS:90}
recurring.min-tickets=${RECURRING_MIN_TICKETS:2}

# ── CORS ──
# Orígenes permitidos (coma-separados). Vacío = ninguno: la app móvil no necesita CORS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ── Servidor ──
# Detrás del proxy de EasyPanel: Tomcat toma la IP real del cliente de X-Forwarded-For
# (solo si el proxy es una IP interna de confianza). La usan el rate limiting y los logs.
server.forward-headers-strategy=native
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/plain

# ── Observabilidad ──
# Solo /actuator/health (sin detalles). Sirve de healthcheck para el orquestador.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ── Logs ──
# requestId y userId (MDC) en cada línea. La salida es stdout; si se define
# logging.file.name (LOGGING_FILE_NAME), se rota por tamaño y se retienen 30 días.
logging.pattern.level=%5p [%X{requestId:-},%X{userId:-}]
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.max-file-size=50MB
logging.file.name=${LOGGING_FILE_NAME:}

# ── Rate limiting (por IP; en memoria) ──
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.auth-por-minuto=${RATE_LIMIT_AUTH_POR_MINUTO:30}
rate-limit.sepa-por-minuto=${RATE_LIMIT_SEPA_POR_MINUTO:120}
login.max-fallos-por-ip=20
login.max-fallos-por-email=10
login.ventana-minutos=15
