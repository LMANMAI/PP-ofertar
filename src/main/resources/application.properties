# ── App ──
spring.application.name=PP-ofertar

# ── MySQL ──
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ofertar_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:YellowRadio1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ──
jwt.secret=${JWT_SECRET:SuperSecretKeyParaDesarrolloLocal_CambiarEnProd_2026!}
jwt.expiration-ms=86400000

# ── Swagger / OpenAPI ──
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.url=/api-docs

# ── Multipart (tickets) ──
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
# A long receipt is photographed in several parts, so the request total has to
# allow for all of them at once — 10MB was the per-file limit doubling as the
# whole-request limit, which 5 photos can exceed.
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:60MB}

# ── OCR Service ──
ocr.service-url=${OCR_SERVICE_URL:https://ocr-api-ofertar-ocr-ofertar.qr2vg3.easypanel.host}
ocr.username=${OCR_USERNAME:admin}
ocr.password=${OCR_PASSWORD:changeme}
ocr.timeout=${OCR_TIMEOUT:120}
# Pages of one ticket OCR'd at the same time. Raising it speeds up long
# tickets but puts proportionally more load on the OCR service.
ocr.max-concurrent-pages=${OCR_MAX_CONCURRENT_PAGES:5}

# ── Offer Scraper Service ──
offer.service-url=${OFFER_SERVICE_URL:http://localhost:3000}

# ── Tickets ──
ticket.max-per-user=${TICKET_MAX_PER_USER:50}
