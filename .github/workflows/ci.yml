name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: ofertar_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-retries=10

    env:
      DB_HOST: localhost
      DB_PASSWORD: ci
      JWT_SECRET: clave-de-ci-solo-para-pruebas-0123456789abcdef
      OCR_PASSWORD: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build y tests
        run: ./gradlew build --no-daemon
